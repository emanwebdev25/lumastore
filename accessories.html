<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories | Luma Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">Luma</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Shop</a>
            <a href="categories.html">Categories</a>
            <a href="#">About</a>
        </div>

        <div class="nav-actions">
            <button>🔍</button>
           <a href="cart.html">🛒 <span id="cart-count">0</span></a>
        </div>
    </nav>

    <section class="products">
        <h2>Accessories</h2>

        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product1.jpg" alt="Classic Black Bag">
                </div>

                <h3>Classic Black Bag</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$49.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product2.jpg" alt="Everyday Tote Bag">
                </div>

                <h3>Everyday Tote Bag</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$44.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product14.jpg" alt="Black Leather Wallet">
                </div>

                <h3>Black Leather Wallet</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$29.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product17.jpg" alt="Minimalist Wristwatch">
                </div>

                <h3>Minimalist Wristwatch</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$54.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
