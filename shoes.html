<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes | Luma Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">Luma</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Shop</a>
            <a href="categories.html">Categories</a>
            <a href="#">About</a>
        </div>

        <div class="nav-actions">
            <button>🔍</button>
            <a href="cart.html">🛒 <span id="cart-count">0</span></a>
        </div>
    </nav>

    <section class="products">
        <h2>Shoes</h2>

        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product12.jpg" alt="Everyday Running Shoes">
                </div>

                <h3>Everyday Running Shoes</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$69.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product13.jpg" alt="Leather Loafers">
                </div>

                <h3>Leather Loafers</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$74.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product16.jpg" alt="Casual Sandals">
                </div>

                <h3>Casual Sandals</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$39.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="product-image">
                    <img src="assets/images/product19.jpg" alt="Classic White Sneakers">
                </div>

                <h3>Classic White Sneakers</h3>
                <p class="rating">★★★★★</p>
                <p class="price">$59.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
